name: Push to Docker Hub

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
          
jobs:
  push-backend:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          docker build -t sachinsharmaa07/nivaran-backend:latest ./server
          docker push sachinsharmaa07/nivaran-backend:latest

  push-frontend:
    runs-on: ubuntu-latest
    needs: push-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          docker build -t sachinsharmaa07/nivaran-frontend:latest ./client
          docker push sachinsharmaa07/nivaran-frontend:latest

