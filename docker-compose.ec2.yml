version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: nivaran-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: nivaran

  backend:
    image: sachinsharmaa07/nivaran-backend:latest
    container_name: nivaran-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file:
      - .env
    volumes:
      - ./repo/server:/app
      - /app/node_modules

  frontend:
    image: sachinsharmaa07/nivaran-frontend:latest
    container_name: nivaran-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./repo/client:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:

